<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运维 · 版本发布与回退</title>
  <link rel="icon" href="data:,">
  <style>
    /* 沿用现有运维工作区的内容、卡片、选中态层级，原型不加载外部资源。 */
    :root { color-scheme:dark; --background:#191919; --content:#121212; --card:#202020; --soft:#1b1b1b; --muted:#2a2a2a; --line:#353535; --text:#eee; --subtle:#a3a3a3; --primary:#eee; --primary-ink:#171717; --success:#8dcc9e; --success-bg:#1c2d23; --warning:#e2bd80; --warning-bg:#32291c; --danger:#efa199; --danger-bg:#372221; --accent:#aac3e2; --accent-bg:#222c38; }

    * { box-sizing:border-box; }

    .target-line code { color:var(--text); } .target-line #target-access { display:flex; align-items:center; gap:8px; } .target-line #target-access span:last-child { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .section-heading .button { padding-right:0; } .section-description { font-size:11px; color:var(--subtle); margin:-5px 0 12px; }
    .select-label { display:block; color:var(--subtle); font-size:11px; margin-bottom:6px; }
    select,input,textarea { width:100%; min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:5px; background:var(--content); font-size:12px; }
    select { height:40px; } textarea { resize:vertical; } input:disabled { color:var(--subtle); }

    .release-meta { display:flex; flex-wrap:wrap; gap:8px 20px; margin:0 0 17px; }

    .diff-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 3px; } .diff-heading .button { padding-right:0; }
    .table-wrap { overflow:auto; }

    .data-note { font-size:10px; color:var(--subtle); margin-top:12px; }

    .check-mark { color:var(--success); font-size:12px; } .check-mark.warning { color:var(--warning); } .check-mark.danger { color:var(--danger); } .check-mark.pending { color:var(--subtle); }

    /* 部署内页签区分发布和历史，共用顶部目标与运行状态。 */
    .deployment-tabs { display:flex; gap:24px; border-bottom:1px solid var(--line); margin-bottom:18px; }
    .deployment-tab { display:inline-flex; align-items:center; gap:7px; padding:10px 0; margin-bottom:-1px; border-bottom:2px solid transparent; background:transparent; color:var(--subtle); font-size:12px; white-space:nowrap; }
    .deployment-tab:hover { color:var(--text); } .deployment-tab[aria-selected="true"] { color:var(--text); border-bottom-color:var(--text); font-weight:600; }
    .history-count { min-width:18px; padding:0 5px; border-radius:4px; background:var(--muted); color:var(--subtle); font-size:10px; font-weight:400; text-align:center; }
    .history-panel { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .history-header { padding:16px 20px; } .history-header p { margin-top:4px; color:var(--subtle); font-size:11px; }
    .history-table { min-width:650px; } .history-table tr:hover { background:var(--soft); } .history-table td { vertical-align:middle; } .history-table .button { padding:4px 7px; min-height:25px; }
    .history-version { font-weight:550; } .history-id { font-size:10px; color:var(--subtle); }
    .notice { padding:10px 12px; background:var(--warning-bg); color:var(--warning); font-size:11px; border-radius:6px; margin-top:12px; }
    .notice.danger { background:var(--danger-bg); color:var(--danger); } .notice.neutral { background:var(--soft); color:var(--subtle); }
    .run-banner { border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--card); padding:12px 15px; margin-bottom:16px; border-radius:7px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .run-banner.warning { border-left-color:var(--warning); } .run-banner.success { border-left-color:var(--success); } .run-banner strong { font-size:12px; } .run-banner p { font-size:10px; color:var(--subtle); }

    .key-values { margin:0; } .key-values div { display:grid; grid-template-columns:90px minmax(0,1fr); gap:10px; border-bottom:1px solid var(--line); padding:8px 0; font-size:11px; } .key-values dt { color:var(--subtle); } .key-values dd { margin:0; overflow-wrap:anywhere; }
    .version-transition { display:flex; gap:20px; align-items:center; padding:0 0 14px; } .version-transition strong { display:block; font-size:24px; font-weight:550; } .version-transition small { color:var(--subtle); } .version-transition>span { font-size:22px; color:var(--subtle); }
    .acknowledge { display:flex; align-items:start; gap:8px; font-size:11px; margin-top:14px; } .acknowledge input { width:15px; height:15px; margin:3px 0 0; flex-shrink:0; }

    .evidence strong { color:var(--text); font-weight:500; } .evidence ul { padding-left:18px; margin:5px 0 0; }

    .settings-form { display:flex; flex-direction:column; gap:22px; }

    .settings-section h3 { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:13px; }
    .settings-section p { font-size:11px; color:var(--subtle); } .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:13px; }

    .settings-field.full { grid-column:1/-1; } .readonly-field { border:1px solid var(--line); border-radius:5px; background:var(--soft); padding:9px 10px; font-size:11px; overflow-wrap:anywhere; }
    .settings-section-header { display:flex; gap:10px; align-items:center; justify-content:space-between; }

    .settings-note { color:var(--subtle); font-size:11px; } .settings-dialog { width:min(680px,calc(100% - 28px)); }

  <script>

    const releases = [

      { id:'v1.7.3', commit:'a72b0c4', build:'#241', config:'cfg-017', fingerprint:'69b1a102', available:true, api:'81c2', worker:'29d4', description:'库存同步稳定版；可容忍新增可空字段，读写兼容性已有示例测试。' },
      { id:'v1.7.2', commit:'d43e8a1', build:'#236', config:'cfg-016', fingerprint:'32cc8b11', available:true, api:'7b31', worker:'18a6', description:'历史稳定版；保留镜像与配置，使用前重新核对当前环境。' },
      { id:'v1.6.8', commit:'b81f342', build:'#219', config:'cfg-012', fingerprint:'41d2c71e', available:true, api:'22ef', worker:'10b9', requiresLegacyColumn:true, description:'旧版仍读取已移除的 stock_count 字段，无法直接回退。' },
      { id:'v1.6.0', commit:'18ac531', build:'#201', config:'cfg-009', fingerprint:'c91a22b1', available:false, api:'1a01', worker:'0b82', requiresLegacyColumn:true, description:'历史镜像已清理且配置归档缺失，仅保留当时的运行事实。' },

    /** 场景只替换原型的预设事实；故障场景仍须检查并确认后才模拟执行。 */
    const scenarios = {
      compatible:{label:'新增字段 · 兼容迁移',kind:'expand',description:'新增 display_name 与查询索引，保留旧字段；旧应用仍可读写。'},

      missing:{label:'证据缺失 · 待核对',kind:'unverified',description:'尚未取得迁移清单和启动脚本依据，不能认定本次没有数据库变更。'},
      checksum:{label:'迁移校验值 · 发生漂移',kind:'expand',description:'已执行迁移 042 的文件校验值改变，需核查历史，不能自动修正。'},
      'app-failure':{label:'迁移成功 · 应用验证失败',kind:'expand',outcome:'failed',description:'确认后模拟迁移完成、应用探针失败，可核对后恢复兼容应用。'},
      unknown:{label:'迁移断连 · 结果未知',kind:'expand',outcome:'unknown',description:'确认后在迁移阶段断连，保留占用；字段存在也不能证明操作完成。'},
      backfill:{label:'分批回填 · 中途暂停',kind:'backfill',outcome:'paused',description:'兼容应用上线后回填，模拟复制延迟触发暂停；核对游标后单独确认续跑。'},
      secret:{label:'秘密引用 · 已失效',kind:'none',description:'数据库凭据引用已撤销，镜像和旧配置仍在也不能直接发布或回退。'},

    /** 页面状态是唯一事实源；弹窗只投影状态，不控制运行生命周期。 */

    /** 页面内计时器、确认票据和焦点引用不持久化。 */

    /** 原生弹窗负责焦点隔离和 Escape 关闭。 */

    /** 返回初始公开地址与数据库绑定；不含任何凭据。 */
    function defaultSettings() { return {source:'https://git.example.com/ops/inventory',registry:'registry.example.com',access:'https://inventory.example.com',database:'inventory_prod'}; }
    /** 校验设置输入，返回规范化公开配置；含凭据或非法目标时返回 null。 */
    function parseSettings(value) {
      if (!value || !['source','registry','access'].every((key) => typeof value[key] === 'string' && value[key].length <= 500)) return null;
      /** 数据库只允许内置演示身份，修改目标需要重新预检。 */
      const normalized = {source:value.source.trim().replace(/\/$/,''),registry:value.registry.trim().replace(/\/$/,''),access:value.access.trim().replace(/\/$/,''),database:value.database || 'inventory_prod'};
      if (!['inventory_prod','inventory_staging'].includes(normalized.database) || !/^[a-z0-9.-]+(?::\d{1,5})?(?:\/[a-z0-9._-]+)*$/i.test(normalized.registry)) return null;
      for (const key of ['source','access']) {
        if (!normalized[key]) continue;
        try {
          /** 地址只用于展示，禁止将用户名、密码和查询令牌写入缓存。 */
          const address = new URL(normalized[key]);
          if (!['https:','http:'].includes(address.protocol) || address.username || address.password || address.search || address.hash) return null;
        } catch { return null; }
      }
      return normalized;
    }
    /** 创建指定演示场景；入参场景 ID，返回完整且互相一致的初始快照。 */
    function createInitialState(scenario = 'compatible') {
      /** 历史是当时验证的事实，不代表在新数据条件下仍可回退。 */
      const initial = {scenario,settings:defaultSettings(),current:'v1.7.3',selected:'v1.8.0',scriptRevision:1,environment:{expanded:false,backfill:0,dataValidated:false,newStates:false,uncertain:false},checking:false,checkEpoch:0,report:null,analysis:null,lockId:null,recoveryFrom:null,observationAt:'10 月 14 日 09:20',runs:[
        {id:'run_7K3M',from:'v1.7.2',to:'v1.7.3',type:'发布',status:'succeeded',time:'10 月 14 日 09:18',verified:true},
        {id:'run_6H2P',from:'v1.6.8',to:'v1.7.2',type:'发布',status:'succeeded',time:'10 月 12 日 16:03',verified:true},
        {id:'run_5G1N',from:'v1.6.0',to:'v1.6.8',type:'发布',status:'succeeded',time:'09 月 30 日 18:20',verified:true},
        {id:'run_4F0L',from:'v1.6.0',to:'v1.6.0',type:'发布',status:'succeeded',time:'09 月 20 日 11:05',verified:true},
      ]};
      if (scenario === 'semantics') {
        initial.current = 'v1.8.0'; initial.selected = 'v1.7.3'; initial.environment.newStates = true;

    }
    /** 按内置 ID 查找产物；返回版本对象或 undefined。 */
    function release(id) { return releases.find((item) => item.id === id); }
    /** 根据预设数据库 ID 返回完整身份，防止预发布库被显示成生产连接。 */
    function databaseLabel(database) { return `${database === 'inventory_staging' ? 'pg-staging' : 'pg-primary'} / ${database} / public`; }
    /** 转义显示值，返回安全 HTML 文本。 */
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g,(character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])); }
    /** 返回当前演示时间，显式标明中国标准时间。 */
    function nowLabel() { return new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) + ' CST'; }
    /** 判断记录是否仍有计时推进；暂停、失败和未知均不推进。 */
    function isActive(run) { return Boolean(run && ['preparing','running','verifying'].includes(run.status)); }
    /** 返回持有目标占用的运行；空闲时返回 undefined。 */
    function lockedRun() { return state.runs.find((run) => run.id === state.lockId); }
    /** 只认同环境中的成功验证记录，返回版本是否有历史验证。 */
    function wasVerified(id) { return state.runs.some((run) => run.to === id && run.status === 'succeeded' && run.verified); }
    /** 返回候选历史来源，防止当前设置重新解释旧镜像地址。 */
    function candidateSettings() {

      const prior = state.runs.find((run) => run.to === state.selected && run.status === 'succeeded' && run.verified);

    }
    /** 返回本次动作名称；恢复已验证版本也属于独立应用回退。 */

    /** 只在明确失败且核对执行结束后允许规划恢复，不对未知运行开放。 */

    /** 返回当前占用是否阻止候选检查；恢复候选必须绑定原失败运行。 */
    function executionBlocked() { return Boolean(lockedRun() && !(state.recoveryFrom === state.lockId && recoveryReady(lockedRun()))); }
    /** 同一版本只有明确的恢复候选可重新应用，避免普通重复发布。 */
    function hasSelection() { return state.selected !== state.current || Boolean(state.recoveryFrom); }
    /** 根据真实示例环境判断版本兼容与资产，不使用 schema 数字等值推断。 */
    function blockersFor(version) {
      /** 这些约束同样用于历史版本，不能被候选场景掩盖。 */
      const blockers = [];
      if (!version.available) blockers.push('镜像或配置归档缺失，无法恢复这套版本');
      if (version.requiresLegacyColumn) blockers.push('旧应用依赖已移除的 stock_count 字段，读写不兼容');
      if (state.environment.newStates && !version.supportsNewStates) blockers.push('旧应用无法识别 RESERVED_PARTIAL 状态；表结构相同也不能直接回退');

      return blockers;
    }
    /** 返回最近一个当前兼容的历史版本，缺少条件时返回 undefined。 */
    function rollbackTarget() { return state.runs.filter((run) => run.status === 'succeeded' && run.verified && run.to !== state.current).map((run) => release(run.to)).find((version) => version && blockersFor(version).length === 0); }
    /** 生成候选输入身份；包含目标、脚本、环境和恢复来源，任何改变均使报告失效。 */
    function candidateKey() { return JSON.stringify([state.current,state.selected,release(state.selected).fingerprint,state.settings,state.scenario,state.scriptRevision,state.environment,state.recoveryFrom]); }
    /** 返回短演示计划号；仅作视觉身份，生产方案需使用完整内容摘要。 */
    function planId() {
      /** 简单散列只用于本地样例展示，不能作为安全签名。 */
      let hash = 2166136261;
      for (const character of candidateKey()) hash = Math.imul(hash ^ character.charCodeAt(0),16777619);
      return 'plan_' + (hash >>> 0).toString(16);
    }
    /** 返回仍绑定当前输入且未过期的报告，否则返回 null。 */
    function validReport() { return state.report && state.report.key === candidateKey() && state.report.expiresAt > Date.now() ? state.report : null; }

      /** 过期报告拒绝使用，避免把旧分析套到新计划。 */
      const report = validReport(), plan = candidatePlan();
      if (!report) { renderAgent(); return; }
      state.analysis = {key:candidateKey(),text:report.blockers.length ? `建议暂停${intent()}：${report.blockers.join('；')}。先补证据或生成独立修复计划，再重新检查；不能通过 SSH 绕过限制。` : `${state.current} → ${state.selected}：${plan.kind === 'backfill' ? `${plan.migrationRequired ? '先扩展字段' : '保留已完成扩展'}、部署兼容读写，从游标 ${plan.backfillStart.toLocaleString()} 继续回填和校验；不要提前切换读取。` : plan.kind === 'expand' ? '先执行兼容扩展迁移，再部署应用。新增结构保留，应用失败时重新检查后恢复兼容版本。' : '本次不执行迁移，保留当前结构和业务数据。'}检查确认了产物和读写条件；仍需遵守维护窗口与观察阈值。`};
      closeDialog(); render(); toast('预设分析已展示；没有发送消息或执行发布');
    }
    /** 运行排查使用该运行快照，不能替代核对，也不能将 unknown 直接解锁。 */
    function renderRunAgent() {
      /** 从绑定的运行获取事实，避免引用当前候选覆盖历史。 */
      const run = state.runs.find((item) => item.id === dialogRunId);
      if (!run) return;
      dialogView = 'run-agent';
      dialogContent('Agent 排查建议','预设分析示例 · 不会调用模型或修改服务器',`<div class="evidence"><strong>引用 ${escapeHtml(run.id)}</strong><p>${run.status === 'unknown' ? '先核对执行器、数据库会话、迁移历史与校验值。当前对象可见不足以证明旧操作停止，禁止重发迁移或释放占用。' : run.status === 'paused' ? '核对已提交批次与游标一致、复制延迟回落后，只续跑剩余范围。条件写入不得覆盖并发新值。' : '分别保留迁移和应用结果。核对执行器已经退出，再验证旧应用能读写当前结构与数据，准备独立应用恢复计划。'}</p></div><div class="notice">恢复需要模块重新校验与用户确认。Agent 的建议不会改写阶段结果，也不会自动执行。</div><div class="dialog-footer"><button class="button outline" data-action="back-run">返回运行记录</button></div>`);
    }
    /** 切换演示预设；真实占用不能靠切换场景被忽略，仅重置演示可清理样例。 */
    function selectScenario(id) {
      if (!scenarios[id] || lockedRun()) return;
      clearTimeout(runTimer); invalidateCandidate(); state = createInitialState(id);
      selectDeploymentTab('release');
      persist(); render(); toast('已载入场景：' + scenarios[id].label);
    }
    /** 统一按钮路由，只处理内置动作和经过校验的版本/运行身份。 */
    document.addEventListener('click',(event) => {
      /** 兼容图标内部点击，禁用按钮不派发动作。 */
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      if (button.dataset.deploymentTab) { selectDeploymentTab(button.dataset.deploymentTab); return; }
      if (button.dataset.section) { if (button.dataset.section !== '部署') toast(button.dataset.section + '沿用程序现有页面；此原型展示部署流程'); return; }
      /** 动作不包含任意脚本、远端地址执行或模型调用。 */
      const action = button.dataset.action;
      if (action === 'check') checkCandidate();
      else if (action === 'confirm') { approvalId = validReport()?.id || null; openDialog('confirm'); }
      else if (action === 'start') startRun();
      else if (action === 'close') closeDialog();
      else if (action === 'run') openDialog('run',button.dataset.run);
      else if (action === 'unknown' || action === 'fail') simulateFailure(action === 'unknown' ? 'unknown' : 'failed');
      else if (action === 'rollback' || action === 'choose-version') { if (dialog.open) closeDialog(document.querySelector('#release-select')); selectRelease(button.dataset.version); document.querySelector('#candidate-area').scrollIntoView({behavior:'smooth',block:'start'}); document.querySelector('#release-select').focus({preventScroll:true}); if (action === 'rollback') checkCandidate(); }
      else if (action === 'agent' || action === 'reference') openDialog('agent');
      else if (action === 'simulate-agent') simulateAgent();
      else if (action === 'observe') observeRun();
      else if (action === 'prepare-recovery') prepareRecovery();
      else if (action === 'resume') openDialog('resume',dialogRunId);
      else if (action === 'confirm-resume') resumeRun();
      else if (action === 'run-agent') renderRunAgent();
      else if (action === 'back-run') { dialogView = 'run'; renderRun(); }
      else if (action === 'history') { closeDialog(document.querySelector('#history-tab')); selectDeploymentTab('history',true); document.querySelector('#history-tab').scrollIntoView({behavior:'smooth',block:'nearest'}); }
      else if (action === 'detect-settings') document.querySelector('#settings-suggestion').hidden = false;
      else if (action === 'apply-settings-suggestion') {
        /** 识别结果只填入草稿，不覆盖访问域名或数据库目标。 */
        const suggested = defaultSettings();
        document.querySelector('#settings-source').value = suggested.source; document.querySelector('#settings-registry').value = suggested.registry;
        document.querySelector('#settings-suggestion').hidden = true; document.querySelector('#settings-error').hidden = true; toast('已填入草稿；保存后生效，未连接服务器或调用模型');
      }
      else if (action === 'change-script' && !lockedRun()) { state.scriptRevision = state.scriptRevision === 1 ? 2 : 1; invalidateCandidate(); persist(); render(); renderMigration(); toast('迁移草稿已改变，原检查和确认已失效'); }
      else if (['target','artifacts','versions','reset','migration','recovery'].includes(action)) openDialog(action);
      else if (action === 'confirm-reset') { clearTimeout(runTimer); invalidateCandidate(); state = createInitialState(); selectDeploymentTab('release'); closeDialog(); persist(); render(); toast('演示已重置'); }
      else if (action === 'theme') { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('dutydeck.server-ops-compose.theme',document.documentElement.dataset.theme); } catch { /* 主题切换不依赖持久化成功。 */ } }
      else if (action === 'disconnect') toast('可在运行详情中演示连接中断；真实程序沿用现有 SSH 断开流程');
      else if (action === 'project' || action === 'switch-connection') toast('沿用当前运维项目与连接选择器；此稿固定为库存生产示例');
    });
    /** 表单提交只保存公开设置，禁止浏览器默认导航。 */
    document.addEventListener('submit',(event) => { if (event.target.id === 'settings-form') { event.preventDefault(); saveSettings(); } });
    /** 控件变化需要清除旧候选；确认复选框仅解锁对应动作按钮。 */
    document.addEventListener('change',(event) => {
      if (event.target.id === 'release-select') selectRelease(event.target.value);
      if (event.target.id === 'scenario-select') selectScenario(event.target.value);
      if (event.target.id === 'acknowledge') document.querySelector('#start-button').disabled = !event.target.checked;
      if (event.target.id === 'resume-acknowledge') document.querySelector('#resume-button').disabled = !event.target.checked;
    });
    /** 页签支持方向键循环以及 Home/End，焦点与选中内容一起切换。 */
    document.querySelector('.deployment-tabs').addEventListener('keydown',(event) => {
      if (!event.target.matches('[role="tab"]') || !['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
      event.preventDefault();
      /** 两个固定视图无需重建 DOM，切换不会丢失展开详情或在途检查。 */
      const id = event.key === 'Home' ? 'release' : event.key === 'End' ? 'history' : event.target.dataset.deploymentTab === 'release' ? 'history' : 'release';
      selectDeploymentTab(id,true);
    });
    /** 约束键盘焦点在弹窗内部，同时保留原生 Escape 行为。 */
    dialog.addEventListener('keydown',(event) => {
      if (event.key !== 'Tab') return;
      /** 只收集可见且启用的控件，包括可键盘展开的依据。 */
      const controls = Array.from(dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,[tabindex="0"]')).filter((control) => control.getClientRects().length);
      /** 首尾控制循环，不将焦点移到遮罩后的页面。 */
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    /** 关闭后恢复原焦点；失效节点则退到仍可操作的检查或结果入口。 */
    dialog.addEventListener('close',() => { dialogView = null; approvalId = null; if (dialogOpener?.isConnected && !dialogOpener.disabled && dialogOpener.getClientRects().length) dialogOpener.focus(); else (document.querySelector('#run-banner button') || document.querySelector('.deployment-tab[aria-selected="true"]')).focus(); });
    restore(); render(); persist();

  </script>
</body>
</html>
