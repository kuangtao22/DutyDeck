    /** 演示文档仅属于此 HTML；所有正文与来源均为虚构样例。 */
    const initialDocs = [
      {id:'overview',group:'活动定位',title:'活动总览',state:'ready',source:'策划初稿.md、项目启动讨论',memory:'m3',body:'> 在城市附近，安排一次有节奏、有留白的秋日户外体验。\n\n## 活动定位\n面向希望短暂离开城市的年轻人，以轻徒步、营地交流与日落音乐三个环节，串联一整天的体验。活动规模控制在 40 人以内，优先保证参与体验与现场服务。\n\n## 核心体验\n- 轻徒步：低强度路线，让第一次参加户外活动的人也能加入。\n- 营地交流：以小组共创和围炉茶歇建立自然连接。\n- 日落音乐：以小型不插电演出收尾，保留自由交流时间。\n\n## 策划边界\n首场以验证体验为主，先完成单场执行方案。报名节奏、现场服务和物料准备都围绕这一目标展开。\n\n## 仍待补充\n营地最终报价与极端天气预案尚未确认，相关文件保留待补状态。'},
      {id:'audience',group:'活动定位',title:'目标人群与需求',state:'ready',source:'访谈记录.md',body:'## 核心人群\n面向周末有短途出行需求、希望建立轻社交连接的城市年轻人。\n\n## 已识别需求\n- 路线与集合说明应清楚，降低首次参与成本。\n- 社交活动保持自愿，提供自由休息区域。\n- 在报名前明确费用包含项与退订规则。\n\n## 待验证问题\n正式发布前仍需验证集合时段和交通方式。'},
      {id:'signup',group:'参与与服务',title:'报名与参与流程',state:'ready',source:'报名说明.md、报名流程讨论',memory:'m2',body:'## 报名流程\n活动介绍 → 填写参与信息 → 确认名额 → 收到行前说明 → 现场签到。\n\n## 名额管理\n- 首场最多开放 40 个名额。\n- 名额满员后进入候补名单，依次通知。\n- 行前一天发送集合位置、联系人与装备清单。\n\n## 参与体验\n报名说明优先呈现时间、地点、费用包含项和退订规则。补充信息放在展开区域，避免首次填写过长。\n\n## 待确认\n定金金额与具体退订时间节点尚未确认。'},

    ];
    /** 来源样例只服务于核对覆盖状态，不冒充已经整理的知识。 */

    let state={page:'knowledge',initialized:true,docs:structuredClone(initialDocs),memories:structuredClone(initialMemories),selectedDoc:'overview',selectedMemory:'m1',memoryFilter:'active',memoryQuery:'',docQuery:'',closedGroups:new Set(),returnDoc:null,theme:'light',docDrafts:{},editing:false,workflow:null,updated:false};
    /** 页面及对话框节点，供集中渲染和键盘焦点恢复使用。 */
    const main=document.getElementById('main'),modal=document.getElementById('modal'),drawer=document.getElementById('drawer'),toastNode=document.getElementById('toast');
    /** 计时器只驱动原型的模拟反馈，不创建后台业务任务。 */
    let workflowTimer=null,toastTimer=null,scanTimer=null,lastFocus=null,forgottenMemory=null,updateTimer=null;

    /** 渲染按钮；输入中文标签、动作名、图标及额外属性，返回按钮 HTML。 */

    /** 只渲染演示所需的 Markdown 子集；输入文本，返回已转义的标题、段落和列表。 */
    function markdown(text){return text.split(/\n\n+/).map(block=>{if(block.startsWith('## '))return block.split('\n').map(line=>line.startsWith('## ')?`<h3>${esc(line.slice(3))}</h3>`:`<p>${esc(line)}</p>`).join('');if(block.startsWith('> '))return `<blockquote>${esc(block.slice(2))}</blockquote>`;if(block.startsWith('- '))return `<ul>${block.split('\n').map(line=>`<li>${esc(line.replace(/^- /,''))}</li>`).join('')}</ul>`;return `<p>${esc(block).replace(/\n/g,'<br>')}</p>`;}).join('');}

    function render(){document.documentElement.dataset.theme=state.theme;document.querySelectorAll('.workspace-tab').forEach(element=>{/** 此 Tab 是否对应当前页面。 */const selected=element.dataset.page===state.page;element.classList.toggle('active',selected);element.setAttribute('aria-selected',String(selected));element.tabIndex=selected?0:-1;});main.setAttribute('aria-labelledby','tab-'+state.page);document.getElementById('doc-count').textContent=state.initialized?state.docs.length:'—';document.getElementById('memory-count').textContent=state.memories.filter(memory=>memory.active).length;main.innerHTML=state.page==='knowledge'?knowledgePage():memoryPage();}
    /** 知识库页面：生成前提供入口，生成后展示目录与真实正文样例。 */
    function knowledgePage(){return `<div class="page-head"><div><h1>知识库</h1><p class="page-subtitle">把项目资料整理成体系，随项目推进持续完善。</p></div><div class="head-actions">${button('来源资料','sources','folder','','optional')}${state.initialized?button('更新内容','update','sparkle','','primary'):''}</div></div>${state.workflow?.stage==='generating'?`<div class="notice">${state.workflow.paused?icon('pause'):'<span class="spinner"></span>'}<span>${state.workflow.paused?'知识整理已暂停':'正在按大纲整理内容'} · ${state.workflow.index} / ${state.workflow.items.length} 篇</span>${button('查看进度','workflow-open','arrow','','small ghost')}</div>`:''}${state.updated?'<div class="notice">'+icon('check')+'已核对可用资料。预算报价与天气预案仍缺依据，保留待补充。</div>':''}<div class="surface">${state.initialized?`<div class="knowledge-layout"><aside class="tree-panel"><div class="tree-top"><strong style="font-weight:500">文档目录</strong><span class="spacer"></span><button class="icon-button" data-action="organize" aria-label="调整目录" title="调整目录">${icon('more')}</button></div><label class="search-box">${icon('search')}<input id="doc-search" aria-label="搜索知识文档" placeholder="搜索文档" value="${esc(state.docQuery)}"></label><div class="tree-list" id="tree-list">${treeHtml()}</div><div class="tree-bottom">${icon('folder')}项目 / ${esc(state.workflow?.root||'知识库')} /</div></aside><section class="document" id="document-panel">${documentHtml()}</section></div>`:`<div class="empty-view"><div class="empty-icon">${icon('book')}</div><h2>让项目资料有一个清晰的归处</h2><p>Agent 先分析现有信息，提出适合这个项目的分组。你确认后，再生成大纲和内容文件。</p>${button(state.workflow?.stage==='proposal'?'继续确认分组':'分析现有资料','start','sparkle','','primary')}<div class="empty-steps"><span><b>1</b>分析与分组</span>${icon('arrow')}<span><b>2</b>确认范围</span>${icon('arrow')}<span><b>3</b>大纲与内容</span></div><p style="margin-top:26px;font-size:11px">项目记忆已独立保存，可随时继续使用。 <button class="text-button" data-action="nav" data-page="memory">查看记忆</button></p></div>`}</div>`;}
    /** 目录按演示数据中的分组生成，不使用固定场景分类。 */
    function treeHtml(){/** 查询命中的文档集合与其动态分组。 */const filtered=state.docs.filter(doc=>(doc.title+doc.group).includes(state.docQuery)),groups=[...new Set(filtered.map(doc=>doc.group))];return groups.length?groups.map(group=>`<div class="tree-group"><button class="tree-folder" data-action="folder" data-group="${esc(group)}" aria-expanded="${!state.closedGroups.has(group)}">${icon('chevron',`chevron ${state.closedGroups.has(group)?'closed':''}`)}${icon('folder')}<span>${esc(group)}</span></button>${state.closedGroups.has(group)?'':filtered.filter(doc=>doc.group===group).map(doc=>`<button class="tree-file ${state.selectedDoc===doc.id?'selected':''}" data-action="doc" data-id="${doc.id}" aria-current="${state.selectedDoc===doc.id?'true':'false'}">${icon('file')}<span class="file-name">${esc(doc.title)}</span>${doc.state!=='ready'?'<span class="pending-dot" title="内容尚未补全"></span>':''}</button>`).join('')}</div>`).join(''):'<div class="no-results">没有找到匹配文档</div>';}
    /** 渲染所选文档；待生成条目显示内容缺口，编辑模式提供显式保存和取消。 */
    function documentHtml(){/** 当前文档，缺失时回到首项。 */const doc=state.docs.find(item=>item.id===state.selectedDoc);if(!doc)return '<div class="empty-view"><p>没有匹配的文档，调整关键词后继续浏览。</p></div>';return `<div class="doc-toolbar"><div class="breadcrumb">${esc(doc.group)}<span>/</span>${esc(doc.title)}.md</div>${doc.state!=='pending'?button('编辑','edit-doc','edit','','small ghost'):button('补充这篇','supplement','sparkle','','small')}<button class="icon-button" data-action="doc-history" aria-label="查看文档更新记录">${icon('clock')}</button></div><article class="doc-body"><div class="doc-eyebrow">${icon('file')}项目文档</div><h2>${esc(doc.title)}</h2><div class="inline-meta">${statusBadge(doc.state)}<span>本地 Markdown</span><span class="sep">·</span><span>${doc.edited?'刚刚由你更新':'10 月 8 日更新'}</span></div>${state.editing?`<label class="form-label" for="doc-edit">编辑正文</label><textarea id="doc-edit" class="edit-area">${esc(state.docDrafts[doc.id]??doc.body)}</textarea><div class="form-error" id="doc-error" role="alert"></div><div class="edit-actions">${button('取消','cancel-doc')}${button('保存修改','save-doc','check','','primary')}</div>`:doc.state==='pending'?`<div class="related-note">${icon('info')}<div><strong>大纲已建立，正文等待补充</strong><p>${doc.id==='weather'?'还需要场地的天气应对条件、应急联系人和延期规则。':'需要补充这一主题的资料与明确要求。'}已有资料不足以生成完整正文。</p></div></div><div class="prose"><h3>计划补充的内容</h3><ul>${doc.id==='weather'?'<li>天气监测与活动调整条件</li><li>现场负责人和联络方式</li><li>延期、取消及参与者通知安排</li>':'<li>相关目标与适用范围</li><li>有依据的内容与结论</li><li>仍需确认的信息</li>'}</ul></div>${button('提供信息给 Agent','supplement','plus','','primary')}`:`${doc.id==='overview'?'<div class="doc-facts"><div class="doc-fact"><small>活动形式</small><span>单日户外体验</span></div><div class="doc-fact"><small>参与规模</small><span>最多 40 人</span></div><div class="doc-fact"><small>项目阶段</small><span>首场筹备</span></div><div class="doc-fact"><small>核心目标</small><span>验证参与体验</span></div></div>':''}<div class="prose">${markdown(doc.body)}</div>`}${!state.editing?`<div class="doc-footer"><button class="text-button" data-action="sources">${icon('link')}查看依据</button>${doc.memory?`<button class="text-button" data-action="related-memory" data-id="${doc.memory}">${icon('brain')}关联记忆</button>`:''}<span class="spacer"></span><span>${esc(state.workflow?.root||'知识库')}/${esc(doc.group)}/${esc(doc.title)}.md</span></div>`:''}</article>`;}
    /** 记忆主页面与知识库状态无关，始终提供新增、编辑和停止使用。 */
    function memoryPage(){return `<div class="page-head"><div><h1>记忆</h1><p class="page-subtitle">记录协作偏好、纠正与经验，让每次对话接得上。</p></div><div class="head-actions">${button('记住一件事','new-memory','plus','','primary')}</div></div><div class="surface"><div class="memory-layout"><section class="memory-list-panel"><div class="memory-tools"><label class="search-box">${icon('search')}<input id="memory-search" aria-label="搜索记忆" placeholder="搜索记忆内容" value="${esc(state.memoryQuery)}"></label><div class="filter-tabs" role="tablist" aria-label="记忆状态"><button role="tab" aria-selected="${state.memoryFilter==='active'}" data-action="memory-filter" data-filter="active" class="${state.memoryFilter==='active'?'active':''}">使用中<span>${state.memories.filter(memory=>memory.active).length}</span></button><button role="tab" aria-selected="${state.memoryFilter==='inactive'}" data-action="memory-filter" data-filter="inactive" class="${state.memoryFilter==='inactive'?'active':''}">已停用<span>${state.memories.filter(memory=>!memory.active).length}</span></button></div></div><div class="memory-results" id="memory-results">${memoryRows()}</div><div class="memory-status"><span class="dot"></span>独立保存 · 知识库暂停时仍可记录</div></section><section class="memory-detail" id="memory-detail">${memoryDetail()}</section></div></div>`;}
    /** 按当前使用状态与关键词过滤记忆，返回条目数组。 */
    function filteredMemories(){return state.memories.filter(memory=>memory.active===(state.memoryFilter==='active')&&(memory.title+memory.text+memory.type).includes(state.memoryQuery));}
    /** 记忆条目使用轻量列表，状态与来源不与知识文档混为一类。 */
    function memoryRows(){/** 搜索结果，仅用于当前列表。 */const memories=filteredMemories();return memories.length?memories.map(memory=>`<button class="memory-row ${memory.id===state.selectedMemory?'selected':''}" data-action="memory" data-id="${memory.id}"><div class="inline-meta"><span class="tag">${esc(memory.type)}</span><span>${esc(memory.date)}</span></div><strong>${esc(memory.title)}</strong><p>${esc(memory.text)}</p>${memory.link?'<div class="inline-meta" style="margin-top:9px;justify-content:flex-start;gap:5px">'+icon('link')+(state.initialized&&state.docs.some(doc=>doc.id===memory.link)?'关联 1 篇知识文档':'关联文档待整理')+'</div>':''}</button>`).join(''):`<div class="no-results">${state.memoryQuery?'没有找到匹配记忆。试试其他关键词。':state.memoryFilter==='inactive'?'还没有停用的记忆':'尚无使用中的记忆。可点击“记住一件事”添加。'}</div>`;}
    /** 详情展示正文、原话与引用；用户能明确知道 Agent 将使用什么。 */
    function memoryDetail(){/** 当前选中的记忆及其关联文档。 */const memory=state.memories.find(item=>item.id===state.selectedMemory),doc=memory?.link?state.docs.find(item=>item.id===memory.link):null;if(!memory)return '<div class="empty-view"><div class="empty-icon">'+icon('brain')+'</div><p>选择一条记忆查看详情</p></div>';return `${state.returnDoc?`<button class="return-link" data-action="return-doc">${icon('back')}返回刚才的知识文档</button>`:''}<div class="detail-kicker">${icon('brain')}项目记忆<span class="spacer"></span><span class="badge ${memory.active?'green':''}">${memory.active?'使用中':'已停用'}</span></div><span class="tag">${esc(memory.type)}</span><h2>${esc(memory.title)}</h2><div class="inline-meta"><span>${esc(memory.date)}</span><span class="sep">·</span><span>仅当前项目</span></div><div class="memory-content">${esc(memory.text)}</div><div class="detail-label">记录依据</div><blockquote class="source-quote">${esc(memory.quote)}</blockquote><button class="text-button" data-action="memory-source" style="margin-top:9px">${icon(memory.manual?'edit':'chat')}${memory.manual?'查看手动记录':'查看来源对话'}</button>${memory.link?`<div class="detail-label">关联知识</div>${state.initialized&&doc?`<button class="relation-link" data-action="linked-doc" data-id="${doc.id}">${icon('file')}<span>${esc(doc.title)}<small style="display:block;font-size:10px;color:var(--muted);margin-top:2px">${esc(doc.group)} / ${esc(doc.title)}.md</small></span>${icon('arrow')}</button>`:'<p class="quiet" style="font-size:11px">关联文档尚未生成，记忆仍独立保留。</p>'}`:''}<div class="memory-actions">${button('编辑','edit-memory','edit')}${button(memory.active?'停止使用':'恢复使用','toggle-memory',memory.active?'pause':'play','','ghost')}</div><div class="scope-note">${icon('info')}<span>${memory.active?'相关任务中会按需使用这条记忆。停止使用后保留记录，可随时恢复。':'这条记忆保留在历史中，后续对话不再将其作为当前依据。'}</span></div>`;}
    /** 显示轻量反馈；可选撤销按钮仅恢复本次演示记忆。 */
    function toast(message,undo=false){clearTimeout(toastTimer);toastNode.innerHTML=icon('check')+`<span>${esc(message)}</span>`+(undo?'<button data-action="undo-memory">撤销</button>':'');toastNode.classList.add('visible');toastTimer=setTimeout(()=>toastNode.classList.remove('visible'),4300);}
    /** 打开模态或侧抽屉，记录触发焦点；标题与正文均由本地模板生成。 */
    function openDialog(target,title,subtitle,body,footer='',view='detail'){target.dataset.view=view;if(!target.open)lastFocus=document.activeElement;target.innerHTML=`<div class="dialog-shell"><div class="dialog-head"><div><h2 id="${target===modal?'modal':'drawer'}-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="icon-button" data-action="close-dialog" aria-label="关闭">${icon('close')}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}</div>`;if(!target.open)target.showModal();}
    /** 关闭当前对话框，焦点返回仍然存在的触发按钮；流程可稍后续接。 */
    function closeDialog(target){target.close();if(lastFocus?.isConnected)lastFocus.focus();}
    /** 从当前项目文档构造可编辑提案，分组名称和数量均可调整。 */
    function initialGroups(){/** 建库前使用资料样例，已有库使用当前正文。 */const catalog=state.initialized?state.docs:initialDocs;return [...new Set(catalog.map(doc=>doc.group))].map((title,index)=>({id:'g'+index,title,selected:true,documents:catalog.filter(doc=>doc.group===title).map(doc=>doc.id),description:['定位、参与人群与体验目标','报名路径、行前沟通与现场服务','内容节奏、传播文案与视觉素材','预算物料、应急方案与活动复盘'][index]||'按已有内容继续整理，保留当前分组。'}));}
    /** 启动扫描演示；只在页面内延迟展现提案，不访问磁盘或模型。 */
    function startWorkflow(){if(state.workflow&&state.workflow.stage!=='done'){showWorkflow();return;}state.workflow={stage:'scanning',groups:initialGroups(),templates:structuredClone(state.initialized?state.docs:initialDocs),root:state.workflow?.root||'知识库',instruction:'',items:[],index:0,paused:false};showWorkflow();clearTimeout(scanTimer);scanTimer=setTimeout(()=>{if(state.workflow?.stage!=='scanning')return;state.workflow.stage='proposal';if(modal.open&&modal.dataset.view==='workflow')showWorkflow();refreshWorkflowPage();},1100);}
    /** 保存提案控件的当前值，保证关闭或重绘后输入不丢失。 */
    function syncProposal(){if(state.workflow?.stage!=='proposal')return;modal.querySelectorAll('[data-group-title]').forEach(input=>{/** 对应的提案分组。 */const group=state.workflow.groups.find(item=>item.id===input.dataset.groupTitle);if(group)group.title=input.value;});modal.querySelectorAll('[data-group-check]').forEach(input=>{/** 对应的提案分组。 */const group=state.workflow.groups.find(item=>item.id===input.dataset.groupCheck);if(group)group.selected=input.checked;});if(modal.querySelector('#plan-root'))state.workflow.root=modal.querySelector('#plan-root').value;if(modal.querySelector('#plan-instruction'))state.workflow.instruction=modal.querySelector('#plan-instruction').value;}
    /** 工作流专用弹窗标识，用于避免后台进度覆盖其他编辑表单。 */
    function openWorkflowDialog(title,subtitle,body,footer){openDialog(modal,title,subtitle,body,footer,'workflow');}
    /** 后台生成只刷新知识页的非编辑视图，不抢走记忆搜索或编辑焦点。 */
    function refreshWorkflowPage(){document.getElementById('doc-count').textContent=state.initialized?state.docs.length:'—';if(state.page==='knowledge'&&!state.editing)render();}
    /** 建库两步弹窗：先扫描并确认分组，再自动生成大纲与补全文档。 */
    function showWorkflow(){/** 当前演示工作流快照。 */const workflow=state.workflow;if(!workflow)return;/** 当前流程的步进指示。 */const steps=`<div class="stepper"><div class="step ${['scanning','proposal'].includes(workflow.stage)?'active':''}"><b>1</b>分析与确认分组</div><div class="step-line"></div><div class="step ${['generating','done'].includes(workflow.stage)?'active':''}"><b>2</b>生成大纲与内容</div></div>`;
      if(workflow.stage==='scanning'){openWorkflowDialog('分析项目资料','由当前项目 Agent 整理 · 扫描状态为演示',`${steps}<div class="scan-activity"><div class="loading-label"><span class="spinner"></span>正在识别项目内容与信息缺口</div><p>策划文档、当前项目对话、图片与已有记忆…</p><div class="progress-line"><i style="width:66%"></i></div></div>`,`<span class="quiet">此阶段只提出整理建议</span><span class="spacer"></span>${button('稍后查看','close-dialog')}`);return;}
      if(workflow.stage==='proposal'){openWorkflowDialog('确认知识库分组','目录根据这次项目资料提出，可改名、增删或补充要求',`${steps}<p class="group-intro">当前资料围绕一场露营活动。建议按下面的主题整理，预算报价和应急预案仍有缺口。已有记忆会继续独立维护。</p>${workflow.groups.map(group=>`<section class="plan-group"><div class="group-head"><input type="checkbox" data-group-check="${group.id}" aria-label="纳入${esc(group.title)}" ${group.selected?'checked':''}>${icon('folder')}<input type="text" data-group-title="${group.id}" value="${esc(group.title)}" aria-label="分组名称：${esc(group.title)}" maxlength="30"><span class="badge">${group.documents.length||1} 篇计划文档</span><button class="icon-button" data-action="remove-group" data-id="${group.id}" aria-label="移除${esc(group.title)}">${icon('close')}</button></div><div class="group-info">${esc(group.description)}<details><summary>查看来源与缺口</summary>${group.documents.length?group.documents.map(id=>{/** 当前计划文档对应的来源说明。 */const doc=workflow.templates.find(item=>item.id===id);return `<div>${esc(doc.title)} · ${esc(doc.source)}</div>`;}).join(''):'暂无已读来源，生成后将保留为待补项。'}</details></div></section>`).join('')}${button('添加分组','add-group','plus','','small ghost')}<div class="root-path">${icon('folder')}保存到项目目录<input id="plan-root" value="${esc(workflow.root)}" aria-label="知识库目录" maxlength="60"></div><label class="form-label" for="plan-instruction">补充整理要求 <span class="quiet" style="font-weight:400">（可选）</span></label><textarea id="plan-instruction" class="full-width" rows="2" placeholder="例如：把报名规则写成可直接发给参与者的说明。">${esc(workflow.instruction)}</textarea><p class="form-helper">确认后先生成大纲，再依次补充有依据的内容。缺少信息的文件会保留待补状态。</p><div id="plan-error" class="form-error" role="alert"></div>`,`<span class="quiet" id="plan-summary">选择 ${workflow.groups.filter(group=>group.selected).length} 个分组</span><span class="spacer"></span>${button('稍后处理','close-dialog')}${button('确认范围并生成','confirm-plan','arrow','','primary')}`);return;}
      /** 已处理数量及完成汇总，仅基于当前工作流条目计算。 */const ready=workflow.items.filter(item=>item.processed&&item.doc.state==='ready').length,partial=workflow.items.filter(item=>item.processed&&item.doc.state!=='ready').length;
      openWorkflowDialog(workflow.stage==='done'?'知识库已整理':'按大纲补全内容',workflow.stage==='done'?'已有依据的内容已整理，缺口继续保留':'已确认范围内自动继续，无需逐篇确认',`${steps}<div class="inline-meta" style="margin-bottom:12px">${workflow.stage==='done'?icon('check'):workflow.paused?icon('pause'):'<span class="spinner"></span>'}<span>${workflow.stage==='done'?`${ready} 篇已整理 · ${partial} 篇待补充`:workflow.paused?'已暂停，记忆仍可正常使用':`正在整理第 ${Math.min(workflow.index+1,workflow.items.length)} / ${workflow.items.length} 篇`}</span></div><div class="progress-line"><i style="width:${workflow.items.length?workflow.index/workflow.items.length*100:0}%"></i></div>${workflow.groups.filter(group=>group.selected).map(group=>`<div class="outline-group"><h3>${icon('folder')}${esc(group.title)}</h3>${workflow.items.filter(item=>item.groupId===group.id).map(item=>`<div class="outline-row">${icon('file')}<span>${esc(item.doc.title)}.md</span>${item.processed?statusBadge(item.doc.state):'<span class="badge">待生成</span>'}</div>`).join('')}</div>`).join('')}${workflow.instruction?`<div class="related-note">${icon('info')}<div><strong>本次整理要求</strong><p>${esc(workflow.instruction)}</p><p>演示仅保留要求；实际内容调整由项目 Agent 完成。</p></div></div>`:''}`,`${workflow.stage==='done'?`<span class="quiet">项目 / ${esc(workflow.root)} /</span><span class="spacer"></span>${button('查看知识库','finish-plan','arrow','','primary')}`:`<span class="quiet">${workflow.paused?'随时从已完成进度继续':'可关闭弹窗，稍后查看进度'}</span><span class="spacer"></span>${button(workflow.paused?'继续整理':'暂停','pause-plan',workflow.paused?'play':'pause')}${button('返回项目','close-dialog','','','primary')}`}`);}
    /** 校验确认范围并建立大纲；原型只替换示例文档，记忆数据保持独立。 */
    function confirmPlan(){syncProposal();/** 选择分组及输入错误节点。 */const groups=state.workflow.groups.filter(group=>group.selected),error=modal.querySelector('#plan-error');if(!groups.length){error.textContent='至少选择一个分组，再生成知识库。';return;}if(groups.some(group=>!group.title.trim())){error.textContent='请为选中的分组填写名称。';return;}if(groups.some(group=>/[\\/]/.test(group.title))||new Set(groups.map(group=>group.title.trim())).size!==groups.length){error.textContent='分组名称不能重复，也不能包含路径分隔符。';return;}if(!state.workflow.root.trim()||state.workflow.root.includes('..')||/[\\/:]/.test(state.workflow.root)){error.textContent='请填写有效的项目内目录名，如“活动知识库”。';return;}state.workflow.root=state.workflow.root.trim();state.workflow.groups.forEach(group=>group.title=group.title.trim());state.workflow.items=groups.flatMap(group=>group.documents.length?group.documents.map(id=>({groupId:group.id,processed:false,doc:{...structuredClone(state.workflow.templates.find(doc=>doc.id===id)),group:group.title}})):[{groupId:group.id,processed:false,doc:{id:'custom-'+group.id,group:group.title,title:group.title+'概览',state:'pending',source:'待补充来源',body:''}}]);state.workflow.stage='generating';state.workflow.index=0;state.workflow.paused=false;/** 原有但未纳入本次整理的文档保留，避免调整范围隐式删除资料。 */const retained=state.initialized?state.docs.filter(doc=>!state.workflow.items.some(item=>item.doc.id===doc.id)):[];state.docs=[...state.workflow.items.map(item=>({...item.doc,state:'pending',body:''})),...retained];state.initialized=true;state.updated=false;state.selectedDoc=state.docs[0].id;state.page='knowledge';state.docQuery='';render();showWorkflow();advanceWorkflow();}
    /** 分批模拟内容生成，暂停或完成时不继续调度。 */
    function advanceWorkflow(){clearTimeout(workflowTimer);if(state.workflow?.stage!=='generating'||state.workflow.paused)return;workflowTimer=setTimeout(()=>{/** 当前待处理的大纲项。 */const item=state.workflow.items[state.workflow.index];if(!item)return;item.processed=true;state.docs[state.workflow.index]=structuredClone(item.doc);state.workflow.index++;if(state.workflow.index>=state.workflow.items.length)state.workflow.stage='done';refreshWorkflowPage();if(modal.open&&modal.dataset.view==='workflow')showWorkflow();if(state.workflow.stage==='generating')advanceWorkflow();else toast('知识库整理完成，信息缺口已保留');},850);}
    /** 新增与编辑记忆表单，不依赖知识库确认状态。 */
    function memoryForm(id=null){/** 当前记忆或新建默认值。 */const memory=state.memories.find(item=>item.id===id)||{id:'',title:'',type:'协作偏好',text:'',link:null};openDialog(modal,id?'编辑记忆':'记住一件事','保存在当前项目，未来相关对话中按需使用',`<form id="memory-form" data-id="${memory.id}"><label class="form-label" for="memory-title">一句话概括</label><input class="full-width" id="memory-title" maxlength="70" value="${esc(memory.title)}" placeholder="例如：方案调整先解释业务影响" required><label class="form-label" for="memory-type">类型</label><select id="memory-type" class="full-width">${['协作偏好','决策背景','经验','纠正'].map(type=>`<option ${memory.type===type?'selected':''}>${type}</option>`).join('')}</select><label class="form-label" for="memory-body">需要记住的内容</label><textarea id="memory-body" class="full-width" rows="5" placeholder="记录明确的偏好、背景或经验，方便后续协作。" required>${esc(memory.text)}</textarea><label class="form-label" for="memory-link">关联知识文档 <span class="quiet">（可选）</span></label><select id="memory-link" class="full-width"><option value="">暂不关联</option>${state.initialized?state.docs.map(doc=>`<option value="${doc.id}" ${memory.link===doc.id?'selected':''}>${esc(doc.group)} / ${esc(doc.title)}</option>`).join(''):''}</select><p class="form-helper">关联用于定位背景，文档正文仍在知识库中维护。</p><div id="memory-error" class="form-error" role="alert"></div></form>`,`<span class="quiet">仅当前项目</span><span class="spacer"></span>${button('取消','close-dialog')}${button('保存记忆','save-memory','check','','primary')}`);setTimeout(()=>modal.querySelector('#memory-title')?.focus(),0);}
    /** 保存表单到演示数组；返回主页面中的当前条目。 */
    function saveMemory(){/** 表单及待保存的字段。 */const form=modal.querySelector('#memory-form'),title=modal.querySelector('#memory-title').value.trim(),text=modal.querySelector('#memory-body').value.trim(),type=modal.querySelector('#memory-type').value,link=modal.querySelector('#memory-link').value||null;if(!title||!text){modal.querySelector('#memory-error').textContent='请填写概括和需要记住的内容。';return;}/** 已有条目在原位更新，新增条目使用仅限演示的唯一 ID。 */const memory=state.memories.find(item=>item.id===form.dataset.id);if(memory){Object.assign(memory,{title,text,type,link,date:'刚刚',manual:true,source:'手动修正',quote:'当前内容由你在记忆详情中修正；原来源记录保留。'});state.selectedMemory=memory.id;state.memoryFilter=memory.active?'active':'inactive';}else{/** 新增条目的页面内身份。 */const id='m-'+Date.now();state.memories.unshift({id,title,text,type,link,date:'刚刚',active:true,manual:true,source:'手动记录',quote:'由你在项目记忆中明确记录。'});state.selectedMemory=id;state.memoryFilter='active';}state.page='memory';state.memoryQuery='';closeDialog(modal);render();toast('记忆已保存，知识文档保持独立');}
    /** 展示可追溯的来源样例，不把未读图片标为已理解。 */
    function showSources(){openDialog(drawer,'来源资料','用于提炼和核对，原始文件保留在原处',`<p class="group-intro">知识库文档会综合这些材料。来源变化时，对应文档标记为待复核。</p>${sources.map(source=>`<div class="source-row">${icon(source.icon)}<div><strong>${esc(source.title)}</strong><p>${esc(source.detail)}</p></div><span class="badge ${source.status==='仅登记文件'?'amber':''}">${source.status}</span></div>`).join('')}<div class="related-note">${icon('brain')}<div><strong>记忆可提供背景</strong><p>项目偏好与决策背景通过引用关联，仍在记忆中独立维护。</p></div></div>`,button('关闭','close-dialog','','','primary'));}
    /** 展示需补充信息的输入入口；原型保留需求，文档继续显示缺口。 */
    function supplement(){/** 当前待补文档。 */const doc=state.docs.find(item=>item.id===state.selectedDoc);openDialog(modal,'补充「'+esc(doc.title)+'」','给当前项目 Agent 提供缺少的信息',`<p class="group-intro">${doc.state==='pending'?'这篇文档目前只有大纲。':'这篇文档仍有内容缺口。'}补充已知信息后，Agent 会据此更新正文。</p><label class="form-label" for="supplement-text">补充信息或整理要求</label><textarea id="supplement-text" rows="6" class="full-width" placeholder="例如：说明已确认的联系人、预算报价或延期规则。"></textarea><div class="form-error" id="supplement-error" role="alert"></div><p class="form-helper">交互稿只演示提交，缺少依据的内容不会自动变为已完成。</p>`,`${button('取消','close-dialog')}<span class="spacer"></span>${button('交给 Agent 补充','submit-supplement','sparkle','','primary')}`);}
    /** 重置演示数据和计时器；首次建库状态也保留全部独立记忆。 */
    function resetDemo(first=false){clearTimeout(toastTimer);toastNode.classList.remove('visible');forgottenMemory=null;clearTimeout(workflowTimer);clearTimeout(scanTimer);clearTimeout(updateTimer);state={...state,page:'knowledge',initialized:!first,docs:structuredClone(initialDocs),memories:structuredClone(initialMemories),selectedDoc:'overview',selectedMemory:'m1',memoryFilter:'active',memoryQuery:'',docQuery:'',closedGroups:new Set(),returnDoc:null,docDrafts:{},editing:false,workflow:null,updated:false};modal.close();drawer.close();render();}
    /** 集中处理可见交互，动作名来自原型内的可信按钮。 */
    function handleAction(action,element){switch(action){
      case 'nav':state.page=element.dataset.page;state.returnDoc=null;state.editing=state.page==='knowledge'&&Object.hasOwn(state.docDrafts,state.selectedDoc);render();break;
      case 'theme':state.theme=state.theme==='light'?'dark':'light';render();break;
      case 'reset':resetDemo(document.getElementById('scenario').value==='first');toast('演示数据已重置');break;
      case 'doc':state.selectedDoc=element.dataset.id;state.editing=Object.hasOwn(state.docDrafts,state.selectedDoc);render();break;
      case 'folder':state.closedGroups.has(element.dataset.group)?state.closedGroups.delete(element.dataset.group):state.closedGroups.add(element.dataset.group);document.getElementById('tree-list').innerHTML=treeHtml();break;
      case 'memory':state.selectedMemory=element.dataset.id;render();break;
      case 'memory-filter':state.memoryFilter=element.dataset.filter;state.selectedMemory=filteredMemories()[0]?.id||null;state.returnDoc=null;render();break;
      case 'related-memory':state.returnDoc=state.page==='knowledge'?state.selectedDoc:null;state.selectedMemory=element.dataset.id;state.memoryFilter=state.memories.find(item=>item.id===element.dataset.id)?.active?'active':'inactive';state.memoryQuery='';state.page='memory';if(drawer.open)closeDialog(drawer);render();break;
      case 'linked-doc':state.selectedDoc=element.dataset.id;state.page='knowledge';state.editing=false;state.returnDoc=null;if(drawer.open)closeDialog(drawer);render();break;
      case 'return-doc':state.selectedDoc=state.returnDoc;state.returnDoc=null;state.page='knowledge';render();break;
      case 'new-memory':memoryForm();break;
      case 'edit-memory':memoryForm(state.selectedMemory);break;
      case 'save-memory':saveMemory();break;
      case 'toggle-memory':{/** 当前记忆，仅切换其使用状态，不更改关联知识文档。 */const memory=state.memories.find(item=>item.id===state.selectedMemory);forgottenMemory={id:memory.id,active:memory.active};memory.active=!memory.active;memory.date='刚刚';state.memoryFilter=memory.active?'active':'inactive';render();toast(memory.active?'已恢复，相关对话可再次使用':'已停止使用，关联知识文档保留',true);break;}
      case 'undo-memory':if(forgottenMemory){/** 最近一次停止或恢复操作的目标。 */const memory=state.memories.find(item=>item.id===forgottenMemory.id);memory.active=forgottenMemory.active;state.selectedMemory=memory.id;state.memoryFilter=memory.active?'active':'inactive';state.page='memory';render();toast('已撤销记忆状态变更');forgottenMemory=null;}break;
      case 'close-dialog':syncProposal();closeDialog(element.closest('dialog'));break;
      case 'sources':showSources();break;
      case 'start':case 'organize':startWorkflow();break;
      case 'workflow-open':showWorkflow();break;
      case 'add-group':syncProposal();state.workflow.groups.push({id:'g-'+Date.now(),title:'新分组',selected:true,documents:[],description:'根据你的要求新增，尚缺相关资料。'});showWorkflow();break;
      case 'remove-group':syncProposal();state.workflow.groups=state.workflow.groups.filter(group=>group.id!==element.dataset.id);showWorkflow();break;
      case 'confirm-plan':confirmPlan();break;
      case 'pause-plan':state.workflow.paused=!state.workflow.paused;advanceWorkflow();render();showWorkflow();break;
      case 'finish-plan':closeDialog(modal);state.page='knowledge';state.selectedDoc=state.docs.find(doc=>doc.state==='ready')?.id||state.docs[0].id;render();break;
      case 'edit-doc':state.editing=true;document.getElementById('document-panel').innerHTML=documentHtml();document.getElementById('doc-edit').focus();break;
      case 'cancel-doc':delete state.docDrafts[state.selectedDoc];state.editing=false;document.getElementById('document-panel').innerHTML=documentHtml();break;
      case 'save-doc':{/** 待保存的正文及当前文档，空正文不允许覆盖。 */const body=document.getElementById('doc-edit').value.trim(),doc=state.docs.find(item=>item.id===state.selectedDoc);if(!body){document.getElementById('doc-error').textContent='正文不能为空，请补充内容或取消编辑。';break;}doc.body=body;doc.edited=true;delete state.docDrafts[doc.id];state.editing=false;render();toast('文档已保存，记忆内容保持独立');break;}
      case 'supplement':supplement();break;
      case 'submit-supplement':if(!modal.querySelector('#supplement-text').value.trim()){modal.querySelector('#supplement-error').textContent='请先填写补充信息。';break;}closeDialog(modal);toast('补充要求已提交（演示），文档保留待补状态');break;
      case 'update':element.disabled=true;element.innerHTML='<span class="spinner"></span>核对资料中';clearTimeout(updateTimer);updateTimer=setTimeout(()=>{state.updated=true;render();toast('已核对演示资料，缺少依据的内容未强行补全');},850);break;
      case 'memory-source':{/** 来源对话仅取当前记忆的已显示样例。 */const memory=state.memories.find(item=>item.id===state.selectedMemory);openDialog(drawer,memory.manual?'手动记录':'来源对话',esc(memory.source),`<div class="inline-meta">${esc(memory.date)} · 当前项目</div><div class="chat-message user" style="margin-top:24px">${esc(memory.quote)}</div><div class="chat-message"><div class="assistant-label">项目 Agent</div><p>已保留这条协作信息，后续相关任务中会按需参考。</p></div><div class="related-note">${icon('info')}<p>详情只展开相关片段，完整会话仍保存在项目对话中。</p></div>`,button('关闭','close-dialog','','','primary'));break;}
      case 'doc-history':openDialog(drawer,'文档更新记录','活动资料中的版本变化',`<div class="history-item"><h3>今天 14:20 · 内容整理</h3><p>根据项目资料形成主题正文，保留来源与信息缺口。</p></div><div class="history-item"><h3>今天 14:18 · 大纲建立</h3><p>按你确认的分组生成文档目录。</p></div><div class="history-item"><h3>今天 14:16 · 范围确认</h3><p>确认本次需要整理的主题，原始文件保留。</p></div>`,button('关闭','close-dialog','','','primary'));break;
      case 'review':openDialog(drawer,'交互说明','本稿用于确认页面与行为，所有数据均为演示',`<ul class="review-notes"><li><b>1. 顶部 Tabs 切换</b><span>知识库保留目录与正文布局，记忆采用列表与详情。通过顶部 Tabs 切换，分别维护内容。</span></li><li><b>2. 先分组确认，再形成内容</b><span>切换顶部“首次建库”场景，体验扫描、改名、勾选、增加分组与生成过程。生成期间可暂停，返回项目后记忆仍可编辑。</span></li><li><b>3. 关联，不重复复制</b><span>文档底部可进入关联记忆，记忆详情可打开知识文档。停止使用记忆不会删除知识文档。</span></li><li><b>4. 日常页面保持轻量</b><span>来源和历史按需展开，正文缺口明确保留；使用“更新内容”无需再次确认已有范围。</span></li><li><b>5. 可操作范围</b><span>搜索、目录展开、文档编辑、记忆新增/编辑/停用/恢复、来源抽屉、关联跳转、深浅主题均可体验。操作只影响当前页面，刷新可恢复。</span></li></ul>`,button('开始体验','close-dialog','','','primary'));break;
    }}
    /** 使用委托监听减少重复绑定；输入检索只刷新对应列表，保留输入焦点。 */
    document.addEventListener('click',event=>{/** 最近的交互按钮或链接。 */const target=event.target.closest('[data-action]');if(!target||target.disabled)return;event.preventDefault();handleAction(target.dataset.action,target);});
    document.addEventListener('input',event=>{if(event.target.id==='doc-edit')state.docDrafts[state.selectedDoc]=event.target.value;if(event.target.id==='doc-search'){state.docQuery=event.target.value;/** 过滤后的当前文档，确保空结果不会操作之前的正文。 */const matches=state.docs.filter(doc=>(doc.title+doc.group).includes(state.docQuery));if(!matches.some(doc=>doc.id===state.selectedDoc))state.selectedDoc=matches[0]?.id||null;state.editing=Object.hasOwn(state.docDrafts,state.selectedDoc);document.getElementById('tree-list').innerHTML=treeHtml();document.getElementById('document-panel').innerHTML=documentHtml();}if(event.target.id==='memory-search'){state.memoryQuery=event.target.value;/** 当前搜索命中的记忆列表。 */const matches=filteredMemories();if(!matches.some(memory=>memory.id===state.selectedMemory))state.selectedMemory=matches[0]?.id||null;document.getElementById('memory-results').innerHTML=memoryRows();document.getElementById('memory-detail').innerHTML=memoryDetail();}if(event.target.matches('[data-group-check]')){syncProposal();modal.querySelector('#plan-summary').textContent='选择 '+state.workflow.groups.filter(group=>group.selected).length+' 个分组';}});
    document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='memory-form')saveMemory();});
    /** 按左右方向键切换顶部 Tab；Home/End 跳到首尾，返回当前页面内容。 */
    document.querySelector('.workspace-tablist').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();/** 可切换的页签以及目标位置。 */const tabs=[...document.querySelectorAll('.workspace-tab')],index=tabs.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;handleAction('nav',tabs[next]);tabs[next].focus();});
    document.getElementById('scenario').addEventListener('change',event=>resetDemo(event.target.value==='first'));
    /** Escape 关闭前保存提案表单，确保稍后打开仍保留选择。 */
    modal.addEventListener('cancel',()=>syncProposal());
    /** 点击遮罩只关闭弹窗，流程继续保留在页面内。 */
    [modal,drawer].forEach(target=>target.addEventListener('click',event=>{if(event.target===target){/** 点击坐标与弹窗边界用于区分留白和遮罩。 */const rect=target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom){syncProposal();closeDialog(target);}}}));
    /** 页面初始化补齐静态图标，再渲染首屏。 */
    document.querySelectorAll('[data-icon]').forEach(element=>element.innerHTML=icon(element.dataset.icon));
    document.getElementById('project-icon').innerHTML=icon('mountain');document.getElementById('theme-button').innerHTML=icon('sun');document.getElementById('review-button').innerHTML=icon('info');render();
  </script>
</body>
</html>
